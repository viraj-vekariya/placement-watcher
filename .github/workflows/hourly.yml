name: Hourly CDC watcher
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
concurrency:
  group: hourly-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install playwright requests
          python3 -m playwright install --with-deps chromium
      - name: Run hourly check (scrape + rebuild docs/website data)
        env:
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PW: ${{ secrets.ERP_PW }}
          GMAIL: ${{ secrets.GMAIL }}
          APP_PW: ${{ secrets.APP_PW }}
          SECURITY_ANSWERS: ${{ secrets.SECURITY_ANSWERS }}
        run: python3 cloud_hourly.py
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "placement-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_notice_ids.json docs/ 2>/dev/null || true
          git commit -m "chore: hourly update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push
