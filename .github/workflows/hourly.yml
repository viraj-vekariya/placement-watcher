name: Hourly CDC watcher
on:
  # Redundant triggers: cron-job.org (external, POSTs the dispatch API), GitHub's
  # own schedule (unreliable on its own -- it once went silent for 5+ hours --
  # but free extra chances) and a launchd job on the user's Mac that runs
  # `gh workflow run`. ANY of them may fire late, twice, or never; the "gate"
  # step (gate.py) lets a real cycle -- an ERP login -- run only if the last
  # success was 50+ min ago and the last attempt 25+ min ago, so redundancy
  # never means extra logins. Manual runs: `gh workflow run ... -f force=true`.
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if a cycle ran recently (manual testing only)"
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: hourly-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check if a run is actually due
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python3 gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Install deps
        if: steps.gate.outputs.should_run == 'true'
        run: |
          pip install playwright requests
          python3 -m playwright install --with-deps chromium
      - name: Decrypt WhatsApp session
        if: steps.gate.outputs.should_run == 'true'
        env:
          WA_PROFILE_KEY: ${{ secrets.WA_PROFILE_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -d -in wa_profile.tar.gz.enc -out wa_profile.tar.gz -pass env:WA_PROFILE_KEY
          mkdir -p wa_profile
          tar -xzf wa_profile.tar.gz -C wa_profile
          rm -f wa_profile.tar.gz
      - name: Run hourly check + WhatsApp notify
        if: steps.gate.outputs.should_run == 'true'
        env:
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PW: ${{ secrets.ERP_PW }}
          GMAIL: ${{ secrets.GMAIL }}
          APP_PW: ${{ secrets.APP_PW }}
          SECURITY_ANSWERS: ${{ secrets.SECURITY_ANSWERS }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
          FORCE_RUN: ${{ inputs.force }}
        run: python3 cloud_hourly.py
      - name: Re-encrypt WhatsApp session (may have refreshed tokens)
        if: steps.gate.outputs.should_run == 'true' && always()
        env:
          WA_PROFILE_KEY: ${{ secrets.WA_PROFILE_KEY }}
        run: |
          rm -rf wa_profile/Default/"Code Cache" wa_profile/Default/Cache \
                 wa_profile/Default/GPUCache wa_profile/Default/DawnWebGPUCache \
                 wa_profile/Default/DawnGraphiteCache wa_profile/GraphiteDawnCache 2>/dev/null || true
          tar -czf wa_profile.tar.gz -C wa_profile .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in wa_profile.tar.gz -out wa_profile.tar.gz.enc -pass env:WA_PROFILE_KEY
          rm -f wa_profile.tar.gz
      - name: Commit updated state
        if: steps.gate.outputs.should_run == 'true' && always()
        run: |
          git config user.name "placement-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wa_profile.tar.gz.enc seen_notice_ids.json docs/ last_run.json 2>/dev/null || true
          git commit -m "chore: hourly update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          # unattended-safe: someone may have pushed meanwhile; rebase then push, retry once
          git pull --rebase -q || true
          git push || (sleep 5 && git pull --rebase -q && git push)
