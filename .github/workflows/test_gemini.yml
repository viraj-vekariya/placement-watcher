name: One-off Gemini smart_reflow test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests playwright
      - name: Diagnose -- list available Gemini models + raw error body
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.error
          key = os.environ['GEMINI_API_KEY']
          try:
              with urllib.request.urlopen(
                  'https://generativelanguage.googleapis.com/v1beta/models?key=' + key, timeout=25
              ) as resp:
                  data = json.loads(resp.read())
              names = [m['name'] for m in data.get('models', [])
                       if 'generateContent' in m.get('supportedGenerationMethods', [])]
              print('MODELS SUPPORTING generateContent:')
              for n in sorted(names):
                  print(' ', n)
          except urllib.error.HTTPError as e:
              print('ListModels HTTPError', e.code, e.reason)
              print(e.read().decode(errors='replace'))
          except Exception as e:
              print('ListModels other error:', repr(e))
          "
      - name: Diagnose -- raw generateContent call against 2 model names
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.error
          key = os.environ['GEMINI_API_KEY']
          for model in ['gemini-3.8-flash', 'gemini-flash-latest']:
              print('---', model, '---')
              req = urllib.request.Request(
                  f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key=' + key,
                  data=json.dumps({'contents': [{'parts': [{'text': 'Say hello in one word.'}]}]}).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      print('SUCCESS:', json.loads(resp.read()))
              except urllib.error.HTTPError as e:
                  print('HTTPError', e.code, e.reason, '-', e.read().decode(errors='replace'))
              except Exception as e:
                  print('other error:', repr(e))
          "
      - name: Test smart_reflow against real notice text
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          import cloud_hourly as ch

          samples = {
              'IPIM (batch/session glue)': 'Batch One (Morning)Session 1Date: Friday, 25th September 2026Reporting Time: 9:30 AM\n\nVenue: SN Bose AuditoriumLate entries will not be permitted.',
              'Vedanta (roll-glued, already fixed by regex)': ch.reflow('Vedanta Limited (VLDP) has extended the offer to the following student(s):BHUKYA GANESH - 23CH10019SAMEERA JENNA - 23EE10060The students are advised to give offer acceptance by 22.09.26.'),
          }
          for name, text in samples.items():
              print('='*20, name, '='*20)
              print('--- INPUT (post-regex) ---')
              print(text)
              out = ch.smart_reflow(text)
              print('--- OUTPUT (post-Gemini-gate) ---')
              print(out)
              print('IDENTICAL TO INPUT:', out == text)
              print()
          "
