name: WhatsApp one-time setup
on:
  workflow_dispatch: {}
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install playwright requests
          python3 -m playwright install --with-deps chromium
      - name: Link WhatsApp via phone number code
        env:
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: python3 -u wa_cloud.py setup
      - name: Trim + encrypt the resulting session
        if: success()
        env:
          WA_PROFILE_KEY: ${{ secrets.WA_PROFILE_KEY }}
        run: |
          rm -rf wa_profile/Default/"Code Cache" wa_profile/Default/Cache \
                 wa_profile/Default/GPUCache wa_profile/Default/DawnWebGPUCache \
                 wa_profile/Default/DawnGraphiteCache wa_profile/GraphiteDawnCache 2>/dev/null || true
          tar -czf wa_profile.tar.gz -C wa_profile .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in wa_profile.tar.gz -out wa_profile.tar.gz.enc -pass env:WA_PROFILE_KEY
          rm -f wa_profile.tar.gz
          ls -la wa_profile.tar.gz.enc
      - name: Commit encrypted session
        if: success()
        run: |
          git config user.name "placement-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wa_profile.tar.gz.enc
          git commit -m "chore: initial WhatsApp session link" || echo "nothing to commit"
          git push
