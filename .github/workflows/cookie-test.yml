name: ERP cookie cloud test
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test cookie from cloud IP
        env: { CK: "${{ secrets.ERP_COOKIE }}" }
        run: |
          echo "Runner IP:"; curl -s https://api.ipify.org; echo
          curl -s -m 25 -b "$CK" -A "Mozilla/5.0" "https://erp.iitkgp.ac.in/IIT_ERP3/home.htm" -o a.html -w "home HTTP %{http_code}\n"
          echo "AUTH: $(grep -oE 'Welcome [A-Za-z ]+' a.html | head -1)"; echo "loginForm: $(grep -c loginForm a.html)"
          curl -s -m 25 -b "$CK" -A "Mozilla/5.0" "https://erp.iitkgp.ac.in/TrainingPlacementSSO/TPStudent.jsp" -o b.html -w "grid HTTP %{http_code}\n"
          echo "grid bytes: $(wc -c < b.html) | Preview CV: $(grep -c 'Preview CV' b.html)"
          echo "=== VERDICT: 'Welcome Vekariya' + Preview CV:3 => cookie works from cloud => GO ==="
