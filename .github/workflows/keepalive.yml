name: keepalive
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ping
        env:
          ERP_COOKIE: ${{ secrets.ERP_COOKIE }}
        run: python3 -c "import poller; print(poller.keepalive())"
